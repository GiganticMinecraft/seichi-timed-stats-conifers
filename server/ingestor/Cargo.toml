[package]
name = "seichi-timed-stats-conifers-ingestor"
version = "0.1.0"
edition = "2021"

[dependencies]
infra-db-repository-impl = { path = "../infra/db_repository_impl" }
infra-upstream-repository-impl = { path = "../infra/upstream_repository_impl" }
domain = { path = "../domain" }

anyhow = "1.0.82"
tokio = { version = "1.32.0", features = ["rt-multi-thread", "macros", "signal"] }
# OpenTelemetry (traces + metrics) を OTLP HTTP で push する。設定は OTEL_* 環境変数から読み、
# OTEL_EXPORTER_OTLP_ENDPOINT 未設定 (ローカル実行など) なら OTel は無効にして stdout ログだけ出す。
# logs feature は付けない: ログは stdout → Alloy → Loki の経路を正とし、OTLP logs との二重取り込みを避ける
init-tracing-opentelemetry = { version = "0.43", features = ["otlp", "tracing_subscriber_ext", "tracer", "metrics"] }
opentelemetry = { version = "0.33", default-features = false, features = ["metrics", "trace"] }
# 継続プロファイリング (Grafana Pyroscope への push)。
# 短命な CronJob のため pull (scrape) ではなく push モデルを使う
pyroscope = { version = "2.1.1", features = ["backend-pprof-rs"] }

tracing = "0.1.39"
