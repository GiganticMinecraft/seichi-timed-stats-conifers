[package]
name = "infra-upstream-repository-impl"
version = "0.1.0"
edition = "2021"

[dependencies]
domain = { path = "../../domain" }
prost = "0.14.0"
tonic = { version = "0.14.0", features = ["gzip"] }
tonic-prost = "0.14.0"
pbjson-types = "0.9.0"
envy = "0.4.2"
serde = "1.0.198"
anyhow = "1.0.82"
tracing = "0.1.39"
async-trait = "0.1.80"
chrono = "0.4.38"
# 上流への gRPC リクエストに trace context (traceparent) を注入する。
# tracing_level_info: client span を INFO で出す (RUST_LOG=info で動かすため)。
# seichi-game-data-publisher と同じ構成
tonic-tracing-opentelemetry = { version = "0.42", features = ["tracing_level_info"] }
tower = "0.5"

