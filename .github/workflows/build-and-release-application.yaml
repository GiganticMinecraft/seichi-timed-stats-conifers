name: CI
on:
  push:
    paths-ignore:
      - '**.md'

jobs:
  lint-and-test:
    name: Lint and test server
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # reads toolchain info from /rust-toolchain.toml
      # cargo のエラー/警告の GitHub UI 表示はこの action が登録する problem matcher が行う
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          # キャッシュは後続の Swatinem/rust-cache で行う
          cache: false
          # デフォルトだと RUSTFLAGS=-D warnings が注入され warning がすべてエラー化してしまう
          rustflags: ""

      # > selecting a toolchain either by action or manual `rustup` calls should happen
      # > before the plugin, as it uses the current rustc version as its cache key
      # https://github.com/Swatinem/rust-cache/tree/cb2cf0cc7c5198d3364b9630e2c3d457f160790c#example-usage
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      # buf CLIがビルドに必要
      - uses: bufbuild/buf-setup-action@v1
        with:
          # Dockerfile の bufbuild/buf イメージとバージョンを揃えること
          version: "1.72.0"

      # pbjson-types などのビルドに protoc が必要
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      # buf generate (build.rs) が使う protoc プラグイン。バージョンはスクリプト内で固定されている
      - name: Install protoc plugins for buf generate
        run: ./server/install-buf-plugins.sh

      - name: Cargo fmt
        run: cargo fmt --manifest-path server/Cargo.toml --all -- --check

      - name: Cargo build
        run: cargo build --manifest-path server/Cargo.toml

      - name: Cargo clippy
        run: cargo clippy --manifest-path server/Cargo.toml

      - name: Cargo test
        run: cargo test --manifest-path server/Cargo.toml --all-features

  build-image:
    strategy:
      matrix:
        include:
          - component_name: ingestor
            image_name: ghcr.io/giganticminecraft/seichi-timed-stats-conifers-ingestor
            dockerfile: ./server/Dockerfile-ingestor
          - component_name: database-migration
            image_name: ghcr.io/giganticminecraft/seichi-timed-stats-conifers-database-migration
            dockerfile: ./server/Dockerfile-database-migration

    name: Build server docker image (and publish on master) for ${{ matrix.component_name }}
    needs: [ lint-and-test ]
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    concurrency:
      group: docker-build-${{ matrix.component_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image_name }}
          tags: |
            type=sha,prefix=sha-,suffix=,format=short

      - name: Build (and push if on master)
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ${{ matrix.dockerfile }}
          builder: ${{ steps.buildx.outputs.name }}
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # すべてのビルドステージのすべてのレイヤーをキャッシュして欲しいのでmode=max
          cache-to: type=gha,mode=max
